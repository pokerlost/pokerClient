name: Unsigned Apple candidates
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed client commit; owner must approve runner quota first
        required: true
        type: string
permissions:
  contents: read
jobs:
  apple:
    if: ${{ inputs.reviewed_sha == github.sha && vars.APPLE_RUNNER_APPROVED == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - name: Unsigned iOS build
        working-directory: apps/poker_client
        run: flutter build ios --release --no-codesign --no-pub
      - name: Unsigned macOS build
        working-directory: apps/poker_client
        run: |
          set -euo pipefail
          flutter build macos --debug --config-only --no-pub
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-apple-${{ github.sha }}
          path: |
            apps/poker_client/build/ios/iphoneos/
            apps/poker_client/build/macos/Build/Products/Debug/
          retention-days: 14
          if-no-files-found: error
  required:
    if: always()
    needs: apple
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.apple.result }}
        run: test "$RESULT" = success
