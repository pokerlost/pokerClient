name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/flutter
      - run: make install lint typecheck test-unit
      - name: Gate merged Dart line coverage with the standard LCOV tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov
          mkdir -p coverage/dart
          lcov --add-tracefile coverage/contract/lcov.info --add-tracefile coverage/game/lcov.info --add-tracefile coverage/native/lcov.info --add-tracefile coverage/tool/lcov.info --output-file coverage/dart/lcov.info
          lcov --summary coverage/dart/lcov.info --fail-under-lines 100
          echo 'Dart BRDA counters: notMeasured. Browser-only interop is exercised by pokerWeb production-browser acceptance, not native LCOV.' >> "$GITHUB_STEP_SUMMARY"
      - name: Dart verification and complete source inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-source-${{ github.sha }}
          path: |
            coverage/
          retention-days: 14
          if-no-files-found: error
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - name: Build the reusable native test image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: native-test
          load: true
          tags: pokerclient:native-test
          build-args: |
            FLUTTER_REVISION=${{ env.FLUTTER_REVISION }}
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
          cache-from: type=gha,scope=client-native-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,scope=client-native-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }},mode=max
      - name: Fresh real Linux native launch
        run: docker run --init --rm --network none pokerclient:native-test
      - name: Export the native candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: native-artifacts
          outputs: type=local,dest=dist/linux
          build-args: |
            FLUTTER_REVISION=${{ env.FLUTTER_REVISION }}
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
          cache-from: type=gha,scope=client-native-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - name: Build the exact web candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: web-artifacts
          outputs: type=local,dest=dist/docker-web
          build-args: |
            FLUTTER_REVISION=${{ env.FLUTTER_REVISION }}
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
          cache-from: type=gha,scope=client-web-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,scope=client-web-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }},mode=max
      - name: Export the exact clean-commit identity with verified SDK metadata
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/flutter-metadata" <<'SHELL'
          #!/bin/sh
          exec docker run --init --rm --network none --entrypoint flutter pokerclient:native-test "$@"
          SHELL
          chmod 700 "$RUNNER_TEMP/flutter-metadata"
          dart run tool/web_artifact.dart export-web dist/docker-web dist/poker-game-web "$RUNNER_TEMP/flutter-metadata"
      - name: Native and embedded-web candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-builds-${{ github.sha }}
          include-hidden-files: true
          path: |
            dist/linux/
            dist/poker-game-web/
          retention-days: 14
          if-no-files-found: error
  publish-reviewed-web:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CLIENT_ARTIFACT_REVIEWED_SHA == github.event.pull_request.head.sha
    needs: [source, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - name: Retrieve this run's verified bundle and check its exact identity
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ vars.CLIENT_ARTIFACT_REVIEWED_SHA }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "client-builds-$GITHUB_SHA" --dir "$RUNNER_TEMP/client-artifacts"
          dart run tool/web_artifact.dart verify "$RUNNER_TEMP/client-artifacts/poker-game-web" "$REVIEWED_SHA"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/registry-auth" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Authenticate only to the approved private container registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the reviewed development artifact without a release or deploy
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ runner.temp }}/client-artifacts/poker-game-web
          file: Dockerfile.web-artifact
          push: true
          tags: ghcr.io/pokerlost/poker-game-web:sha-${{ github.event.pull_request.head.sha }}
          build-args: CLIENT_COMMIT=${{ github.event.pull_request.head.sha }}
          sbom: true
          provenance: mode=max
      - name: Confirm private package visibility and record the immutable reference
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          visibility=$(gh api orgs/pokerlost/packages/container/poker-game-web --jq .visibility)
          test "$visibility" = private
          printf 'ghcr.io/pokerlost/poker-game-web@%s\n' "$IMAGE_DIGEST" | tee "$RUNNER_TEMP/web-artifact-reference.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-artifact-reference-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/web-artifact-reference.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral registry authentication
        if: always()
        run: rm -rf "$RUNNER_TEMP/registry-auth"
  required:
    if: always()
    needs: [source, native, publish-reviewed-web]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and actual Linux/web acceptance
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(jq -r '.source.result' <<< "$RESULTS")" = success
          test "$(jq -r '.native.result' <<< "$RESULTS")" = success
          publication=$(jq -r '."publish-reviewed-web".result' <<< "$RESULTS")
          test "$publication" = success || { test "$EVENT" = push && test "$publication" = skipped; }
