name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: make install lint typecheck test-unit legacy-build
      - name: Gate merged Dart line coverage with the standard LCOV tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov
          mkdir -p coverage/dart
          lcov --add-tracefile coverage/contract/lcov.info --add-tracefile coverage/game/lcov.info --add-tracefile coverage/native/lcov.info --output-file coverage/dart/lcov.info
          lcov --summary coverage/dart/lcov.info --fail-under-lines 100
          echo 'Dart BRDA counters: notMeasured. Browser-only interop is exercised by pokerWeb production-browser acceptance, not native LCOV.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verification and compatibility wheel artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-source-${{ github.sha }}
          path: |
            coverage/
            dist/
          retention-days: 14
          if-no-files-found: error
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - name: Disposable runner native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - run: flutter pub get --enforce-lockfile
      - run: make build-linux build-web
      - name: Real Linux native launch
        working-directory: apps/poker_client
        run: xvfb-run -a flutter test --no-pub integration_test/app_test.dart -d linux
      - name: Export the exact clean-commit web identity
        run: python3 tools/export_web.py apps/poker_game_web/build/web dist/poker-game-web
      - name: Native and embedded-web candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-builds-${{ github.sha }}
          path: |
            apps/poker_client/build/linux/x64/debug/bundle/
            dist/poker-game-web/
          retention-days: 14
          if-no-files-found: error
  required:
    if: always()
    needs: [source, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and actual Linux/web acceptance
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PYTHON
