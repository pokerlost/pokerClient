name: Unsigned Android candidate
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.ANDROID_BUILD_REVIEWED_SHA == github.event.pull_request.head.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - name: Require an existing SDK license; configure only disposable caches
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -s "$ANDROID_HOME/licenses/android-sdk-license"
          java -version
          {
            printf 'ANDROID_USER_HOME=%s\n' "$RUNNER_TEMP/android-user"
            printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/gradle-cache"
          } >> "$GITHUB_ENV"
      - run: flutter pub get --enforce-lockfile
      - name: Compile the shared native application without signing
        working-directory: apps/poker_client
        run: flutter build apk --debug --no-pub --target-platform android-arm64
      - name: Keep generated signing keys out of the candidate
        run: |
          set -euo pipefail
          if test -d "$ANDROID_USER_HOME"; then
            test -z "$(find "$ANDROID_USER_HOME" -type f \( -name '*.keystore' -o -name '*.jks' \) -print -quit)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-android-arm64-${{ github.event.pull_request.head.sha }}
          path: apps/poker_client/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
          if-no-files-found: error
  android-required:
    if: always()
    needs: [android]
    runs-on: ubuntu-24.04
    steps:
      - env: {RESULT: '${{ needs.android.result }}'}
        run: test "$RESULT" = success
