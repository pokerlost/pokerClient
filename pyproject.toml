[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pokerclient"
version = "0.1.0"
description = "pokerClient cli foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.27,<1"]

[project.scripts]
pokerClient = "pokerClient.cli:app"

[dependency-groups]
dev = ["mypy>=2.3,<3", "ruff>=0.16,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/pokerClient"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pokerClient"]
