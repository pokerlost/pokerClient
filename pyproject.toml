[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pokerclient"
version = "0.1.1.dev0"
description = "pokerClient cli foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.27,<1"]

[project.scripts]
pokerClient = "pokerclient.cli:app"

[dependency-groups]
dev = ["mypy>=2.3,<3", "ruff>=0.16,<1", "pytest>=9,<10", "pytest-cov>=7,<8", "hatchling>=1.27,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/pokerclient"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pokerclient", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = ["unit: isolated unit tests", "integration: external dependency tests", "contract: public contract tests"]

[tool.hatch.build]
exclude = ["/core.[0-9]*", "/.coverage", "/.coverage.*", ".aws", ".aws/**", ".agents/**", ".codex/**", ".serena/**", ".local/**", "apps/**", "packages/**", "backups/**", ".env", ".env.*"]

[tool.coverage.run]
branch = true
source = ["pokerclient", "tools"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
include_namespace_packages = true

[tool.coverage.paths]
client = ["src/pokerclient", "*/site-packages/pokerclient"]

[tool.coverage.json]
output = "coverage/python/coverage.json"

[tool.coverage.xml]
output = "coverage/python/coverage.xml"
